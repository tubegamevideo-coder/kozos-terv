# Éles/otthoni futtatás: app + Postgres. Beállítások a .env-ben (lásd .env.example, docs/DEPLOY.md).
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Állítsd be a POSTGRES_PASSWORD-ot a .env-ben}
      POSTGRES_DB: kozos_terv
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kozos_terv']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/kozos_terv
      ORIGIN: ${ORIGIN:-http://localhost:3100}
    depends_on:
      db:
        condition: service_healthy
    # Helyi elérés (vagy Tailscale); a nyilvános cím a Cloudflare Tunnelen át jön.
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:3000'

  # Cloudflare Tunnel → terv.nebulooo.com (a Cloudflare-en beállított cél: http://app:3000).
  # Csak a „public” profillal indul: COMPOSE_PROFILES=public a .env-ben.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    profiles: ['public']

volumes:
  db-data:
